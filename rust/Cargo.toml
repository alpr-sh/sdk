[package]
name = "alpr-sdk"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
description = "Alpr.sh's SDK for Rust: license plate recognition from photos, cameras, readings and webhooks."
license = "MIT"
homepage = "https://alpr.sh"
repository = "https://github.com/alpr-sh/sdk"
documentation = "https://docs.rs/alpr-sdk"
readme = "README.md"
keywords = ["alpr", "license-plate", "ocr", "api", "webhooks"]
categories = ["api-bindings", "web-programming::http-client"]

[lib]
# The crate is alpr-sdk; the code says `use alpr::…`.
name = "alpr"

[dependencies]
hmac = "0.13"
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.100"
sha2 = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls"] }
